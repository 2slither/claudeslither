<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slither-style snake (WebGL)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e0f16;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  #hud{position:fixed;left:14px;bottom:12px;color:#cfd6ee;font-size:15px;text-shadow:0 1px 3px #000;pointer-events:none}
  #hud b{color:#fff;font-size:18px}
  #tip{position:fixed;top:14px;width:100%;text-align:center;color:#9aa3c4;font-size:14px;pointer-events:none;transition:opacity 1.5s}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:18px;text-align:center;padding:24px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Your length: <b id="len">0</b></div>
<div id="tip">Move the mouse to steer. Hold the mouse button or Space to boost.</div>
<div id="err">WebGL isn't available in this browser.</div>
<script>
(() => {
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias:true, alpha:false});
if (!gl) { document.getElementById('err').style.display = 'flex'; return; }

/* ---------- shaders ---------- */
function prog(vs, fs) {
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p); return p;
}

const bg = prog(`
attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`,
`precision mediump float;
uniform vec2 u_cam, u_res; uniform float u_zoom;
float hexd(vec2 p){ p = abs(p); return max(dot(p, vec2(.5,.866)), p.x); }
void main(){
  vec2 w = (gl_FragCoord.xy - u_res*.5)/u_zoom + u_cam;
  vec2 p = w/48.;
  vec2 r = vec2(1., 1.732), h = r*.5;
  vec2 a = mod(p, r) - h, b = mod(p - h, r) - h;
  vec2 g = dot(a,a) < dot(b,b) ? a : b;
  vec2 id = p - g;
  float d = hexd(g);
  float edge = smoothstep(.43, .5, d);
  float n = fract(sin(dot(floor(id*2.), vec2(12.9898,78.233)))*43758.5453);
  vec3 col = vec3(.060,.066,.095) + n*.014;
  col += edge * vec3(.020,.022,.034);
  col += (1.-smoothstep(0.,.35,d)) * .008;
  vec2 q = gl_FragCoord.xy/u_res - .5;
  col *= 1.0 - dot(q,q)*.9;
  gl_FragColor = vec4(col,1.);
}`);

const sp = prog(`
attribute vec2 a_pos; attribute float a_size; attribute vec3 a_col; attribute float a_mode;
uniform vec2 u_cam, u_res; uniform float u_zoom, u_max;
varying vec3 v_col; varying float v_mode;
void main(){
  vec2 s = (a_pos - u_cam) * u_zoom;
  gl_Position = vec4(s/(u_res*.5), 0., 1.);
  gl_PointSize = min(a_size * u_zoom, u_max);
  v_col = a_col; v_mode = a_mode;
}`,
`precision mediump float;
varying vec3 v_col; varying float v_mode;
void main(){
  vec2 p = gl_PointCoord*2. - 1.; p.y = -p.y;
  float r = length(p);
  if (v_mode > 1.5) {                       // glow
    float a = pow(max(1.-r, 0.), 2.) * .55;
    gl_FragColor = vec4(v_col*a, 0.);
    return;
  }
  if (r > 1.) discard;
  float a = 1. - smoothstep(.9, 1., r);
  if (v_mode > .5) { gl_FragColor = vec4(v_col*a, a); return; }   // flat (eyes)
  vec3 c = v_col * (.62 + .5*(1. - r*r));
  c *= mix(.55, 1., smoothstep(1., .72, r));                       // darker rim
  c += .22 * pow(max(1. - length(p - vec2(-.3,.35))*1.25, 0.), 2.); // highlight
  gl_FragColor = vec4(c*a, a);
}`);

/* ---------- buffers ---------- */
const STRIDE = 7, MAXP = 3000;
const data = new Float32Array(MAXP * STRIDE);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
const tri = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, tri);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

const maxPt = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];

/* ---------- sizing / input ---------- */
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

let mx = W * .75, my = H * .4, moved = false, boost = false;
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; moved = true; });
addEventListener('touchmove', e => { mx = e.touches[0].clientX; my = e.touches[0].clientY; moved = true; }, {passive:true});
addEventListener('mousedown', () => boost = true);
addEventListener('mouseup', () => boost = false);
addEventListener('touchstart', () => boost = true, {passive:true});
addEventListener('touchend', () => boost = false);
addEventListener('keydown', e => { if (e.code === 'Space') { boost = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space') boost = false; });
setTimeout(() => document.getElementById('tip').style.opacity = 0, 6000);

/* ---------- game state ---------- */
const hsv = (h, s, v) => {
  const f = n => { const k = (n + h*6) % 6; return v - v*s*Math.max(0, Math.min(k, 4-k, 1)); };
  return [f(5), f(3), f(1)];
};
const snake = { segs: [], heading: 0, space: 10 };
for (let i = 0; i < 28; i++) snake.segs.push({x: -i*snake.space, y: 0});
const SKIN = [[.30,1.0,.42], [.10,.72,.28]];           // two green stripe colours

const foods = [];
function spawnFood(f, nearHead) {
  const h = snake.segs[0];
  const ang = Math.random() * Math.PI * 2;
  const rad = nearHead ? 650 + Math.random()*450 : Math.random()*1000;
  f.x = h.x + Math.cos(ang)*rad; f.y = h.y + Math.sin(ang)*rad;
  f.r = 4 + Math.random()*4; f.c = hsv(Math.random(), .85, 1); f.ph = Math.random()*6.28;
  return f;
}
for (let i = 0; i < 240; i++) foods.push(spawnFood({}, false));

/* ---------- update ---------- */
let t = 0;
function update(dt) {
  const segs = snake.segs, head = segs[0];
  const n = segs.length;
  let target;
  if (moved) target = Math.atan2(-(my - H/2), mx - W/2);
  else target = Math.sin(t*.6) * 1.2;                   // idle wander before mouse moves
  let diff = target - snake.heading;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  const turn = Math.max(2.2, 5 - n*.01) * dt;
  snake.heading += Math.max(-turn, Math.min(turn, diff));

  const speed = boost ? 300 : 150;
  head.x += Math.cos(snake.heading) * speed * dt;
  head.y += Math.sin(snake.heading) * speed * dt;
  for (let i = 1; i < n; i++) {
    const a = segs[i-1], b = segs[i];
    const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
    if (d > snake.space) { const k = (d - snake.space)/d; b.x += dx*k; b.y += dy*k; }
  }

  const hr = radius();
  for (const f of foods) {
    const dx = head.x - f.x, dy = head.y - f.y, d = Math.hypot(dx, dy);
    if (d > 1200) { spawnFood(f, true); continue; }
    if (d < 90) { f.x += dx/d * 260*dt; f.y += dy/d * 260*dt; }   // magnet pull
    if (d < hr + f.r + 4) {
      spawnFood(f, true);
      if (segs.length < 400) { const l = segs[segs.length-1]; segs.push({x:l.x, y:l.y}); }
    }
  }
  document.getElementById('len').textContent = segs.length * 12;
}
const radius = () => 11 + Math.min(snake.segs.length, 300) * .02 * 4;

/* ---------- render ---------- */
let np = 0;
function put(x, y, size, c, mode) {
  if (np >= MAXP) return;
  const o = np++ * STRIDE;
  data[o] = x; data[o+1] = y; data[o+2] = size;
  data[o+3] = c[0]; data[o+4] = c[1]; data[o+5] = c[2]; data[o+6] = mode;
}

function draw() {
  const segs = snake.segs, n = segs.length, R = radius(), head = segs[0];
  const zoom = dpr * Math.max(.6, 1 - n*.0012);
  np = 0;

  for (const f of foods) {
    const pulse = 1 + Math.sin(t*3 + f.ph)*.12;
    put(f.x, f.y, f.r*5*pulse, f.c, 2);
  }
  for (const f of foods) put(f.x, f.y, f.r*2*(1 + Math.sin(t*3 + f.ph)*.08), f.c, 0);

  // wiggle: lateral sine wave travelling down the body
  const pos = [];
  const amp = R * (boost ? .22 : .38);
  for (let i = 0; i < n; i++) {
    const p = segs[Math.max(i-1, 0)], q = segs[Math.min(i+1, n-1)];
    let tx = p.x - q.x, ty = p.y - q.y; const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    const w = Math.sin(t*(boost ? 14 : 7) - i*.45) * amp * Math.min(1, i/5);
    pos.push([segs[i].x - ty*w, segs[i].y + tx*w]);
  }

  const glowC = boost ? [1,1,.7] : [.3,1,.4];
  for (let i = 0; i < n; i++) put(pos[i][0], pos[i][1], R*(boost?4:3.2), glowC, 2);
  for (let i = n-1; i >= 0; i--) {
    const stripe = SKIN[Math.floor(i/3) % 2];
    const taper = i > n - 8 ? .6 + .4*(n-1-i)/7 : 1;
    put(pos[i][0], pos[i][1], R*2*taper, stripe, 0);
  }

  // eyes
  const ha = snake.heading, dx = Math.cos(ha), dy = Math.sin(ha);
  const nx = -dy, ny = dx, hx = pos[0][0], hy = pos[0][1];
  const look = moved ? Math.atan2(-(my - H/2), mx - W/2) : ha;
  for (const s of [-1, 1]) {
    const ex = hx + dx*R*.35 + nx*s*R*.58, ey = hy + dy*R*.35 + ny*s*R*.58;
    put(ex, ey, R*.95, [1,1,1], 1);
    put(ex + Math.cos(look)*R*.14, ey + Math.sin(look)*R*.14, R*.5, [.02,.02,.05], 1);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.disable(gl.BLEND);
  gl.useProgram(bg);
  gl.bindBuffer(gl.ARRAY_BUFFER, tri);
  let loc = gl.getAttribLocation(bg, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(bg, 'u_cam'), head.x, head.y);
  gl.uniform2f(gl.getUniformLocation(bg, 'u_res'), cv.width, cv.height);
  gl.uniform1f(gl.getUniformLocation(bg, 'u_zoom'), zoom);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disableVertexAttribArray(loc);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(sp);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, np*STRIDE));
  const F = 4, S = STRIDE*F;
  [['a_pos',2,0],['a_size',1,2],['a_col',3,3],['a_mode',1,6]].forEach(([name, size, off]) => {
    const l = gl.getAttribLocation(sp, name);
    gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, S, off*F);
  });
  gl.uniform2f(gl.getUniformLocation(sp, 'u_cam'), head.x, head.y);
  gl.uniform2f(gl.getUniformLocation(sp, 'u_res'), cv.width, cv.height);
  gl.uniform1f(gl.getUniformLocation(sp, 'u_zoom'), zoom);
  gl.uniform1f(gl.getUniformLocation(sp, 'u_max'), maxPt);
  gl.drawArrays(gl.POINTS, 0, np);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last)/1000, .05); last = now; t += dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
